{% extends 'base.html' %}
{% block title %}Order Placed | SciEquip{% endblock %}

{% block content %}

<section class="min-h-[85vh] flex items-center justify-center bg-gray-50 px-4">

    <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl p-10 text-center animate-fade">

        <!-- Success Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 flex items-center justify-center rounded-full 
                        bg-green-100 text-green-600 text-4xl font-bold">
                ✓
            </div>
        </div>

        <!-- Heading -->
        <h2 class="text-3xl font-extrabold text-gray-800 mb-3">
            Order Placed Successfully!
        </h2>

        <!-- Message -->
        <p class="text-gray-600 mb-8 leading-relaxed">
            Thank you for shopping with
            <span class="font-semibold text-indigo-600">SciEquip</span>.
            Your order has been confirmed and will be processed shortly.
        </p>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">

            <a href="{% url 'product_list' %}" class="inline-flex justify-center bg-indigo-600 hover:bg-indigo-700
               text-white px-8 py-3 rounded-full font-semibold
               shadow-lg hover:shadow-xl transition">
                Continue Shopping
            </a>

            <a href="{% url 'home' %}" class="inline-flex justify-center border border-gray-300
               hover:border-indigo-600 text-gray-700 hover:text-indigo-600
               px-8 py-3 rounded-full font-semibold transition">
                Go to Home
            </a>
        </div>

    </div>

</section>

{% endblock %}
