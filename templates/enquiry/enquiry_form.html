{% extends 'base.html' %}

{% block title %}Get Quote | SciEquip{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center
            bg-gradient-to-br from-indigo-50 to-purple-100 px-4 p-10">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-8">

        <!-- Heading -->
        <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-2">
            Get a Quote 📩
        </h2>

        <p class="text-center text-gray-500 mb-6">
            Tell us your requirement and we’ll contact you soon
        </p>

        <!-- Success Message -->
        {% if messages %}
        {% for message in messages %}
        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl mb-6 text-sm text-center">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Product -->
            <div>
                <label class="block font-semibold mb-1 text-gray-700">
                    Product
                </label>
                <input type="text" value="{{ product.name }}" readonly class="w-full bg-gray-100 border rounded-xl px-4 py-3
                              text-gray-600 cursor-not-allowed">
            </div>

            <!-- Name -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <input type="text" name="first_name" placeholder="First Name" required class="w-full border rounded-xl px-4 py-3
                                  focus:ring-2 focus:ring-indigo-500
                                  focus:outline-none">
                </div>

                <div>
                    <input type="text" name="last_name" placeholder="Last Name" required class="w-full border rounded-xl px-4 py-3
                                  focus:ring-2 focus:ring-indigo-500
                                  focus:outline-none">
                </div>
            </div>

            <!-- Phone -->
            <div>
                <input type="text" name="phone" placeholder="Phone Number" required class="w-full border rounded-xl px-4 py-3
                              focus:ring-2 focus:ring-indigo-500
                              focus:outline-none">
            </div>

            <!-- Email -->
            <div>
                <input type="email" name="email" placeholder="Email Address" required class="w-full border rounded-xl px-4 py-3
                              focus:ring-2 focus:ring-indigo-500
                              focus:outline-none">
            </div>

            <!-- Message -->
            <div>
                <textarea name="message" rows="4"
                    placeholder="Describe your requirement (quantity, usage, specifications...)" class="w-full border rounded-xl px-4 py-3
                                 focus:ring-2 focus:ring-indigo-500
                                 focus:outline-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white
                           py-3 rounded-full font-semibold
                           transition duration-300 shadow-md">
                Submit Enquiry
            </button>
        </form>

    </div>
</div>

{% endblock %}
